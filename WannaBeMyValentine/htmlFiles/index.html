<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Willst du mein Valentine sein?</title>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="card">
  <h1 class="title">Willst du meine Valentine sein? 💌</h1>
  <p class="subtitle" id="subtitle">Nur eine ehrliche Antwort ist erlaubt.</p>

  <div class="buttons" id="buttons">
    <button id="yes">Ja 💖</button>
    <button id="no">Nein</button>
  </div>

  <div class="result" id="result">
    <span class="big-heart">🥰</span>
    Wusste ich's doch. Frohen Valentinstag, meine Liebe!
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
